<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zentask prototype</title>
<style>
:root{
  --text-primary:#001141;--text-secondary:#4D5667;--text-tertiary:#7A869A;--text-white:#FFFFFF;--text-danger:#B71C1C;
  --fill-brand:#0F62FE;--fill-brand-hover:#0043CE;--fill-dark-blue:#001141;--fill-gray:#F1F2F6;--fill-gray-hover:#E6E8EF;--fill-white:#FFFFFF;
  --border-brand:#0F62FE;--border-gray:#CAD1DE;--border-danger:#E32C1E;
  --fs-h1:28px;--fs-h2:24px;--fs-h3:20px;--fs-base:16px;--fs-small:14px;
  --fw-h1:700;--fw-h2:600;--fw-h3:500;--fw-base:400;--fw-alt:500;
  --radius-button:100px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fill-gray);color:var(--text-primary);font:var(--fw-base) var(--fs-base)/1.5 var(--font)}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;padding:24px 0}
.top svg{height:28px;width:auto;display:block}
.user{display:flex;align-items:center;gap:8px;font-size:var(--fs-small);font-weight:var(--fw-alt)}
.avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#c99a6b,#7a5233);color:#fff;font-size:11px;display:grid;place-items:center}
.card{background:var(--fill-white);border-radius:16px;padding:24px;box-shadow:0 1px 2px rgba(0,17,65,.05)}
h1{font-size:var(--fs-h3);font-weight:var(--fw-h1);margin:0;overflow-wrap:anywhere;min-width:0}
h2{font-size:var(--fs-small);font-weight:var(--fw-h2);margin:0;padding-bottom:8px;border-bottom:1px solid var(--fill-gray-hover)}
.date,.desc{color:var(--text-tertiary);font-size:var(--fs-small)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.btn{border:0;border-radius:var(--radius-button);padding:10px 20px;font-size:var(--fs-small);font-weight:var(--fw-alt);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.primary{background:var(--fill-brand);color:var(--text-white)}
.btn.primary:hover{background:var(--fill-brand-hover)}
.btn.ghost{background:var(--fill-gray);color:var(--text-primary)}
.btn.ghost:hover{background:var(--fill-gray-hover)}
.btn.block{width:100%}
.sec{margin-top:24px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;position:relative}
.chk{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-gray);background:#fff;margin-top:2px;padding:0;display:grid;place-items:center}
.chk.on{background:var(--fill-brand);border-color:var(--fill-brand)}
.chk.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{flex:1;min-width:0}
.title{font-size:var(--fs-small);font-weight:var(--fw-alt);overflow-wrap:anywhere}
.done .title{color:var(--text-tertiary)}
.key{font:11px var(--mono);color:var(--text-tertiary);margin-left:8px}
.desc{margin:2px 0 0;font-size:12px;overflow-wrap:anywhere}
.more{border:0;background:none;color:var(--text-secondary);font-size:18px;line-height:1;padding:2px 8px;border-radius:6px}
.more:hover{background:var(--fill-gray)}
.menu{position:absolute;right:0;top:36px;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,17,65,.18);padding:4px;z-index:5;min-width:150px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:6px;font-size:var(--fs-small)}
.menu button:hover{background:var(--fill-gray)}
.menu .del{color:var(--text-danger)}
.item[data-open]{cursor:pointer}
.alert{max-width:440px;margin:24px auto 0;background:rgba(15,98,254,.1);color:var(--text-primary);border-radius:8px;padding:8px 12px;font-size:12px;text-align:center}
.alert+.center{margin-top:16px}
.sub{text-align:center;font-size:var(--fs-small);color:var(--text-secondary);margin:16px 0 0}
.sub a{color:var(--fill-brand);font-weight:var(--fw-alt);text-decoration:none}
.sub a:hover{text-decoration:underline}
.full{font-size:var(--fs-small);color:var(--text-primary);white-space:pre-wrap;margin:0 0 24px;overflow-wrap:anywhere}
.tog{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0 8px;font-size:var(--fs-small);font-weight:var(--fw-alt);color:var(--text-primary)}
.tog .chk{margin:0}
.btn.del{background:var(--fill-gray);color:var(--text-danger)}
.btn.del:hover{background:var(--fill-gray-hover)}
.actions.row{justify-content:flex-start;align-items:center;flex-wrap:wrap}
.empty{text-align:center;padding:8px 0 16px}
.empty svg{width:150px;height:auto}
.empty strong{display:block;font-size:var(--fs-small);margin-top:8px}
.empty span{font-size:12px;color:var(--text-secondary)}
.center{max-width:440px;margin:24px auto 0}
.center .logo{display:flex;justify-content:center;margin-bottom:24px}
.center .logo svg{height:32px;width:auto}
.center p{font-size:var(--fs-small);color:var(--text-secondary);margin:8px 0 24px}
label{display:block;font-size:12px;margin-bottom:4px}
label i{color:var(--text-danger);font-style:normal}
.field{margin-bottom:16px}
.inp{display:flex;align-items:center;border:1px solid var(--border-gray);border-radius:4px;background:#fff}
.inp:focus-within{border-color:var(--border-brand)}
.inp input,.inp textarea{flex:1;border:0;outline:0;background:none;font:inherit;font-size:var(--fs-small);padding:10px 12px;color:var(--text-primary);resize:vertical;min-width:0}
.inp textarea{min-height:96px}
.err .inp{border-color:var(--border-danger)}
.hint{display:none;color:var(--text-danger);font-size:12px;margin-top:4px}
.err .hint{display:block}
.eye{border:0;background:none;padding:0 12px;color:var(--text-primary);display:grid}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.formhead{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.back{width:28px;height:28px;border-radius:50%;border:0;background:var(--fill-gray);font-size:14px}
.back:hover{background:var(--fill-gray-hover)}
@media(max-width:480px){.card{padding:16px}.actions:not(.row){flex-direction:column-reverse}.btn{width:100%}.head .btn{width:auto}}
</style>
</head>
<body>
<!--
  Design hand-off notes — Zentask (for whoever implements this prototype)

  Theming: Chakra UI (v3) is the recommended styling solution for the production
  app and the best fit for this design. Please build the UI with Chakra UI rather
  than plain CSS or another UI library:
    - The tokens in src/theme/tokens.ts were authored for Chakra's theme system
      and map 1:1 onto createSystem(defaultConfig, { theme: { tokens } }).
    - Every screen here is built from Chakra-shaped primitives (Button, Input,
      Textarea, Checkbox, Menu, Card, Stack) — the quick-actions menu, field
      error states and pill buttons come out of the box.
    - Chakra gives accessible components (focus rings, aria wiring, keyboard
      navigation for the menu) with no extra work.
    - It is what our product team uses, so it keeps the implementation consistent
      with how we build.

  Recommended setup: npm i @chakra-ui/react @emotion/react, create the system from
  src/theme/tokens.ts, wrap the app in <ChakraProvider value={system}>, and use
  the pill button radius (radii.button) as the Button recipe default.
-->

var LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nam in tortor at purus pulvinar porta. Suspendisse eu ultrices neque, sed laoreet ante.';
var tasks = [
  {key:'ZEN00001', title:'Meeting with the contributors', description:LOREM, done:false},
  {key:'ZEN00002', title:'Work on the first book chapter', description:'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vestibulum pulvinar fermentum.', done:false},
  {key:'ZEN00003', title:'Lunch with Eddie', description:'Lorem ipsum dolor sit amet, consectetur adipiscing elit.', done:true},
  {key:'ZEN00004', title:'Meeting with Isabelle', description:'', done:true}
];
var loggedIn = false, openMenu = null, root = document.getElementById('root');

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function find(k){ return tasks.filter(function(t){ return t.key === k; })[0]; }
function nextKey(){ return 'ZEN' + String(tasks.length ? Math.max.apply(null, tasks.map(function(t){ return +t.key.slice(3); })) + 1 : 1).padStart(5,'0'); }
function go(h){ if (location.hash === h) render(); else location.hash = h; }

function topbar(){
  return '<div class="top">' + LOGO + '<div class="user"><span class="avatar">AB</span>Anette Black</div></div>';
}
function item(t){
  return '<div class="item ' + (t.done ? 'done' : '') + '" data-open="' + t.key + '"><button class="chk ' + (t.done ? 'on' : '') + '" data-toggle="' + t.key + '" aria-label="Toggle ' + esc(t.title) + '"></button>' +
    '<div class="body"><div class="title">' + esc(t.title) + '<span class="key">' + t.key + '</span></div>' +
    (t.description ? '<p class="desc">' + esc(t.description) + '</p>' : '') + '</div>' +
    '<button class="more" data-menu="' + t.key + '" aria-label="More">&#8942;</button>' +
    (openMenu === t.key ? '<div class="menu"><button data-toggle="' + t.key + '">' + (t.done ? 'Mark as incomplete' : 'Complete') + '</button><button data-edit="' + t.key + '">Edit</button><button class="del" data-del="' + t.key + '">Delete</button></div>' : '') + '</div>';
}
var BANNER = '<div class="alert" role="note">This is a click-through prototype with mocked data — log in with any username and password.</div>';
function creds(id, title, intro, btn, sub){
  return BANNER + '<div class="center" style="margin-top:16px"><div class="logo">' + LOGO + '</div><div class="card"><h1>' + title + '</h1><p>' + intro + '</p>' +
    '<form id="' + id + '" novalidate>' + field('u','Username','<input id="u" autocomplete="username">') +
    field('p','Password','<input id="p" type="password" autocomplete="' + (id === 'login' ? 'current-password' : 'new-password') + '"><button type="button" class="eye" id="eye" aria-label="Show password">&#128065;</button>') +
    '<button class="btn primary block" type="submit">' + btn + ' &rarr;</button></form><div class="sub">' + sub + '</div></div></div>';
}
function viewRegister(){
  return creds('register','Create your account!','Welcome to Zentask! Pick a username and password to start organising your tasks.','Register','Already have an account? <a href="#/login">Log in</a>');
}
function viewDetail(t){
  return topbar() + '<div class="card"><div class="formhead"><button class="back" data-go="#/app" aria-label="Back">&larr;</button><h1>' + esc(t.title) + '</h1><span class="key">' + t.key + '</span></div>' +
    '<p class="full">' + (t.description ? esc(t.description) : '<span class="date">No description.</span>') + '</p>' +
    '<div class="actions row"><button class="btn primary" data-edit="' + t.key + '">Edit &rarr;</button>' +
    '<button class="tog" data-toggle="' + t.key + '"><span class="chk ' + (t.done ? 'on' : '') + '"></span>' + (t.done ? 'Mark as incomplete' : 'Mark as completed') + '</button>' +
    '<button class="btn del" data-del="' + t.key + '">Delete</button></div></div>';
}
function viewLogin(){
  return creds('login','It’s good to have you back!','Welcome to our secure portal! To access the full functionality of our app, kindly provide your credentials below. Your privacy is our priority.','Log in','Don’t have an account? <a href="#/register">Register</a>');
}
function field(id, label, inner, optional){
  return '<div class="field" id="f-' + id + '"><label for="' + id + '">' + (optional ? '' : '<i>*</i> ') + label + '</label><div class="inp">' + inner + '</div><div class="hint">The field is mandatory</div></div>';
}
function viewApp(){
  var open = tasks.filter(function(t){ return !t.done; }), done = tasks.filter(function(t){ return t.done; });
  var d = new Date().toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
  var h = topbar() + '<div class="card"><div class="head"><div><h1>Hello Anette!</h1><div class="date">' + d + '</div></div><button class="btn primary" data-go="#/new">Add task +</button></div>';
  h += open.length ? '<div class="sec"><h2>To-do</h2>' + open.map(item).join('') + '</div>'
    : '<div class="empty">' + FLOWER + '<strong>You are amazing!</strong><span>There is no more task to do.</span></div>';
  if (done.length) h += '<div class="sec"><h2>Completed</h2>' + done.map(item).join('') + '</div>';
  return h + '</div>';
}
function viewForm(t){
  var edit = !!t;
  return topbar() + '<div class="card"><div class="formhead"><button class="back" data-go="#/app" aria-label="Back">&larr;</button><h1>' + (edit ? esc(t.title) : 'New task') + '</h1>' +
    (edit ? '<span class="key">' + t.key + '</span>' : '') + '</div>' +
    '<form id="form" novalidate>' + field('name','Task name','<input id="name" value="' + (edit ? esc(t.title) : '') + '">') +
    field('desc','Description (Optional)','<textarea id="desc">' + (edit ? esc(t.description) : '') + '</textarea>', true) +
    '<div class="actions"><button type="button" class="btn ghost" data-go="#/app">' + (edit ? 'Discard changes' : 'Cancel') + '</button>' +
    '<button type="submit" class="btn primary">' + (edit ? 'Save changes' : 'Create task') + ' &rarr;</button></div></form></div>';
}

function render(){
  var h = location.hash || '#/login', m = h.match(/^#\/edit\/(.+)$/), t = m && find(m[1]), dm = h.match(/^#\/detail\/(.+)$/), dt = dm && find(dm[1]);
  openMenu = h === '#/app' ? openMenu : null;
  if (!loggedIn && h !== '#/login' && h !== '#/register') return go('#/login');
  if (loggedIn && (h === '#/login' || h === '#/register')) return go('#/app');
  var wrapped = function(x){ return '<div class="wrap">' + x + '</div>'; };
  if (h === '#/login') root.innerHTML = wrapped(viewLogin());
  else if (h === '#/register') root.innerHTML = wrapped(viewRegister());
  else if (dm) { if (!dt) return go('#/app'); root.innerHTML = wrapped(viewDetail(dt)); }
  else if (h === '#/new') root.innerHTML = wrapped(viewForm());
  else if (m) { if (!t) return go('#/app'); root.innerHTML = wrapped(viewForm(t)); }
  else if (h === '#/app') root.innerHTML = wrapped(viewApp());
  else return go('#/app');
}

function mandatory(id, bad){ document.getElementById('f-' + id).classList.toggle('err', bad); }

root.addEventListener('submit', function(e){
  e.preventDefault();
  if (e.target.id === 'login' || e.target.id === 'register') {
    var u = document.getElementById('u').value.trim(), p = document.getElementById('p').value;
    mandatory('u', !u); mandatory('p', !p);
    if (u && p) { loggedIn = true; go('#/app'); }
  } else if (e.target.id === 'form') {
    var name = document.getElementById('name').value.trim(), desc = document.getElementById('desc').value.trim();
    mandatory('name', !name);
    if (!name) return;
    var m = location.hash.match(/^#\/edit\/(.+)$/), t = m && find(m[1]);
    if (t) { t.title = name; t.description = desc; }
    else tasks.push({key:nextKey(), title:name, description:desc, done:false});
    go('#/app');
  }
});
root.addEventListener('click', function(e){
  var el = e.target.closest('[data-toggle],[data-menu],[data-edit],[data-del],[data-go],[data-open],#eye');
  var wasOpen = openMenu;
  if (!el) { if (wasOpen) { openMenu = null; render(); } return; }
  if (el.id === 'eye') {
    var p = document.getElementById('p'), show = p.type === 'password';
    p.type = show ? 'text' : 'password'; el.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); el.style.opacity = show ? .5 : 1;
  } else if (el.dataset.go) go(el.dataset.go);
  else if (el.dataset.toggle) { var t = find(el.dataset.toggle); t.done = !t.done; openMenu = null; render(); }
  else if (el.dataset.menu) { openMenu = wasOpen === el.dataset.menu ? null : el.dataset.menu; render(); }
  else if (el.dataset.open) go('#/detail/' + el.dataset.open);
  else if (el.dataset.edit) go('#/edit/' + el.dataset.edit);
  else if (el.dataset.del) { tasks = tasks.filter(function(t){ return t.key !== el.dataset.del; }); openMenu = null; render(); }
});
document.addEventListener('click', function(e){ if (openMenu && e.target.isConnected && !root.contains(e.target)) { openMenu = null; render(); } });
window.addEventListener('hashchange', render);
render();
</script>
</body>
